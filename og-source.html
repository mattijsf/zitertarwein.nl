<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    background:#fff; color:#000;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    padding:26px;
  }
  .sheet { border:4px solid #000; height:100%; padding:38px 46px 30px; display:flex; flex-direction:column; }
  .runhead { display:flex; justify-content:space-between; font-size:17px; font-weight:700; letter-spacing:.2em; }
  .runhead .reg { color:#7c7c7c; }
  .rule { border-top:4px solid #000; margin:16px 0 26px; }
  h1 { font-size:78px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  h1 span { border-bottom:7px solid #e2001a; }
  .lede { margin-top:16px; font-size:23px; line-height:1.4; max-width:44ch; }
  .stamp { margin-top:30px; background:#e2001a; color:#fff; font-size:46px; font-weight:700; letter-spacing:-.02em; padding:16px 26px; align-self:flex-start; }
  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
  .fine { font-size:15px; font-weight:700; letter-spacing:.18em; color:#7c7c7c; line-height:1.7; }
  .bars { width:300px; height:52px; }
</style>
</head>
