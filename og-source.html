<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    background:#fff; color:#000;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    padding:26px;
  }
  .sheet { border:4px solid #000; height:100%; padding:38px 46px 30px; display:flex; flex-direction:column; }
  .runhead { display:flex; justify-content:space-between; font-size:17px; font-weight:700; letter-spacing:.2em; }
  .runhead .reg { color:#7c7c7c; }
  .rule { border-top:4px solid #000; margin:16px 0 26px; }
  h1 { font-size:78px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  h1 span { border-bottom:7px solid #e2001a; }
  .lede { margin-top:16px; font-size:23px; line-height:1.4; max-width:44ch; }
  .stamp { margin-top:30px; background:#e2001a; color:#fff; font-size:46px; font-weight:700; letter-spacing:-.02em; padding:16px 26px; align-self:flex-start; }
  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
  .fine { font-size:15px; font-weight:700; letter-spacing:.18em; color:#7c7c7c; line-height:1.7; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:52px; }
  .bars i { background:#000; display:block; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="runhead"><span>ZITERTARWEIN.NL</span><span class="reg">NL · EU 1169/2011</span></div>
    <div class="rule"></div>
    <h1>Zit er <span>tarwe</span> in?</h1>
    <p class="lede">Typ een product en lees terug wat er op het etiket staat. 4.309 producten, met bron.</p>
    <div class="stamp">BEVAT TARWE</div>
    <div class="foot">
      <p class="fine">VOEDINGSCENTRUM · COELIAKIE VERENIGING<br>OPEN FOOD FACTS</p>
      <div class="bars" id="bars"></div>
    </div>
  </div>
<script>
  const w=[3,1,1,2,1,3,1,1,2,3,1,2,1,1,3,2,1,1,2,1,3,1,2,2,1,3,1,1,2,1,1,3,2,1,1,2,3,1,1,2,1,2,3,1,1,2,1,3,1,1];
  document.getElementById('bars').innerHTML = w.map((n,i)=>
    `<i style="width:${n*2}px;height:${i%7===0?52:44}px;${i%2?'background:transparent':''}"></i>`).join('');
</script>
</body>
</html>
