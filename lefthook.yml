pre-commit:
  commands:
    forbidden-text:
      priority: 0
      exclude:
        - lefthook.yml
      run: |
        MATCHES=$(echo {staged_files} | xargs grep -I -in -E "(do not commit|donotcommit)" 2>/dev/null || true)
        if [ -n "$MATCHES" ]; then
          echo "Commit blocked: staged files contain 'do not commit':"
          echo "$MATCHES"
          exit 1
        fi

    eslint:
      priority: 1
      glob: "*.{ts,tsx}"
      stage_fixed: true
      run: pnpm exec eslint --cache --cache-location node_modules/.cache/eslint --fix --max-warnings=0 --no-warn-ignored {staged_files}

    prettier:
      priority: 1
      glob: "*.{js,json,jsonc,css,html,md,yml,yaml}"
      stage_fixed: true
      run: pnpm exec prettier --write --ignore-unknown {staged_files}

    typecheck:
      priority: 2
      glob: "*.{ts,tsx,json}"
      run: pnpm exec tsc -b

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    format:
      run: pnpm format:check
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    escape-hatches:
      run: node scripts/check-escape-hatches.ts
    knip:
      run: pnpm knip
