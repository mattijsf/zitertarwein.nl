<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>App-icoon — zitertarwein.nl</title>
<style>
  /* Source for the app icons. Render with:
       chrome --headless --window-size=512,512 --screenshot=icon.png .../icon-source.html
       chrome --headless --window-size=512,512 --screenshot=mask.png .../icon-source.html?maskable
     The mark is the site's own lockup: a T with the allergen rule under it,
     the same red that only ever means "tarwe". Drawn as rectangles so it
     stays identical at 16px and 512px, with no font dependency. */
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; background: #000; }
  svg { display: block; width: 512px; height: 512px; }
  /* Maskable: Android may crop to a circle, so the mark shrinks into the
     40% safe zone while the background keeps bleeding to the edges. */
  body.maskable .mark { transform: translate(102.4px, 102.4px) scale(0.6); }
</style>
</head>
<body>
  <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" fill="#000"/>
    <g class="mark">
      <g fill="#fff">
        <rect x="166" y="142" width="180" height="44"/>
        <rect x="234" y="142" width="44" height="170"/>
      </g>
      <rect x="166" y="336" width="180" height="34" fill="#e2001a"/>
    </g>
  </svg>
  <script>
    if (location.search.includes("maskable")) document.body.classList.add("maskable");
  </script>
</body>
</html>
