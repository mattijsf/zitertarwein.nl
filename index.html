<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- No interactive-widget: Chrome's default (resizes-visual) keeps the
         layout fully intact when the keyboard opens and only scrolls the field
         into view — exactly "scroll, don't reflow, don't zoom".
         maximum-scale=1 + user-scalable=no block the automatic zoom-in on input
         focus (iOS keeps allowing user pinch-zoom regardless). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>Zit er tarwe in? 🌾</title>
    <meta
      name="description"
      content="Typ een product en ontdek meteen of er tarwe in zit — met betrouwbare bronnen zoals het Voedingscentrum en de Nederlandse Coeliakie Vereniging."
    />
    <!-- All ?p=<product> deep links serve this same page; the canonical keeps
         Google from treating them as thousands of duplicates. The static
         /p/<slug> pages are the indexable per-product versions. -->
    <link rel="canonical" href="https://zitertarwein.nl/" />
    <!-- Social preview (WhatsApp, Signal, X, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zit er tarwe in?" />
    <meta property="og:title" content="Zit er tarwe in?" />
    <meta
      property="og:description"
      content="Typ een product en zie meteen of er tarwe in zit — gratis, met betrouwbare bronnen."
    />
    <meta property="og:url" content="https://zitertarwein.nl/" />
    <meta property="og:image" content="https://zitertarwein.nl/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="nl_NL" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Same lockup as the app icons, drawn as rectangles so it survives 16px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23000'/%3E%3Cg fill='%23fff'%3E%3Crect x='15' y='13' width='18' height='4'/%3E%3Crect x='22' y='13' width='4' height='16'/%3E%3C/g%3E%3Crect x='15' y='31' width='18' height='3' fill='%23e2001a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://nl.openfoodfacts.org" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zit er tarwe in?" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
